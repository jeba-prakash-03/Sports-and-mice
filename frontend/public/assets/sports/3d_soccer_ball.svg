<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="ballShine" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#e2e8f0"/>
      <stop offset="70%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow3d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#00f0ff" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="pentagonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <!-- Ambient Glow Behind Ball -->
  <circle cx="250" cy="250" r="240" fill="url(#cyanGlow)" />

  <!-- Main Ball Sphere -->
  <g filter="url(#shadow3d)">
    <circle cx="250" cy="250" r="190" fill="url(#ballShine)"/>

    <!-- 3D Leather Panel Patterns -->
    <path d="M 250 130 L 295 165 L 280 220 L 220 220 L 205 165 Z" fill="url(#pentagonGrad)" stroke="#00f0ff" stroke-width="2.5" opacity="0.9"/>
    <path d="M 250 130 L 250 70 L 310 90 L 350 130 L 295 165 Z" fill="none" stroke="#334155" stroke-width="3" opacity="0.7"/>
    <path d="M 205 165 L 150 130 L 190 90 L 250 70" fill="none" stroke="#334155" stroke-width="3" opacity="0.7"/>
    
    <path d="M 295 165 L 370 190 L 380 260 L 320 290 L 280 220 Z" fill="url(#pentagonGrad)" stroke="#00f0ff" stroke-width="2.5" opacity="0.85"/>
    <path d="M 220 220 L 180 290 L 120 260 L 130 190 L 205 165 Z" fill="url(#pentagonGrad)" stroke="#00f0ff" stroke-width="2.5" opacity="0.85"/>
    
    <path d="M 280 220 L 320 290 L 285 350 L 215 350 L 180 290 Z" fill="url(#pentagonGrad)" stroke="#00f0ff" stroke-width="2.5" opacity="0.95"/>
    
    <!-- Curved Grid Seams for 3D Convexity -->
    <path d="M 215 350 L 250 420 L 285 350" fill="none" stroke="#334155" stroke-width="3" opacity="0.7"/>
    <path d="M 120 260 L 90 320 L 140 380 L 215 350" fill="none" stroke="#334155" stroke-width="3" opacity="0.7"/>
    <path d="M 380 260 L 410 320 L 360 380 L 285 350" fill="none" stroke="#334155" stroke-width="3" opacity="0.7"/>

    <!-- Specular Highlight Overlay -->
    <ellipse cx="190" cy="150" rx="70" ry="40" fill="#ffffff" opacity="0.35" transform="rotate(-25 190 150)"/>
  </g>
</svg>
