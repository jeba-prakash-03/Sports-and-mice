<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="cricketShine" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="30%" stop-color="#dc2626"/>
      <stop offset="70%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </radialGradient>
    <radialGradient id="redGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#991b1b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0"/>
    </radialGradient>
    <filter id="cricketShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="20" flood-color="#000000" flood-opacity="0.7"/>
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#dc2626" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="250" cy="250" r="240" fill="url(#redGlow)"/>

  <!-- Main Ball Sphere -->
  <g filter="url(#cricketShadow)">
    <circle cx="250" cy="250" r="190" fill="url(#cricketShine)"/>

    <!-- White Stitched Seam Track -->
    <path d="M 80 370 Q 250 130 420 130" fill="none" stroke="#ffffff" stroke-width="6" stroke-dasharray="10 6"/>
    <path d="M 82 368 Q 252 128 422 128" fill="none" stroke="#fef08a" stroke-width="2" stroke-dasharray="8 6"/>

    <!-- Specular Highlight -->
    <ellipse cx="190" cy="150" rx="65" ry="35" fill="#ffffff" opacity="0.35" transform="rotate(-25 190 150)"/>
  </g>
</svg>
