<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="bballShine" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="30%" stop-color="#f97316"/>
      <stop offset="70%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#431407"/>
    </radialGradient>
    <radialGradient id="orangeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#ea580c" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <filter id="bballShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="20" flood-color="#000000" flood-opacity="0.7"/>
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#f97316" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="250" cy="250" r="240" fill="url(#orangeGlow)"/>

  <!-- Main Ball Sphere -->
  <g filter="url(#bballShadow)">
    <circle cx="250" cy="250" r="190" fill="url(#bballShine)"/>

    <!-- Black Ribbed Seams -->
    <path d="M 60 250 L 440 250" fill="none" stroke="#1c1917" stroke-width="9" stroke-linecap="round"/>
    <path d="M 250 60 L 250 440" fill="none" stroke="#1c1917" stroke-width="9" stroke-linecap="round"/>
    
    <!-- Curved Side Seams for 3D Convexity -->
    <path d="M 120 100 C 220 170 220 330 120 400" fill="none" stroke="#1c1917" stroke-width="9" stroke-linecap="round"/>
    <path d="M 380 100 C 280 170 280 330 380 400" fill="none" stroke="#1c1917" stroke-width="9" stroke-linecap="round"/>

    <!-- Specular Highlight -->
    <ellipse cx="190" cy="150" rx="65" ry="35" fill="#ffffff" opacity="0.3" transform="rotate(-25 190 150)"/>
  </g>
</svg>
