<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040914"/>
      <stop offset="100%" stop-color="#0e1730"/>
    </linearGradient>
    <linearGradient id="glowCyan2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="600" fill="url(#bgGrad2)"/>
  
  <!-- Speed Streak Lines -->
  <line x1="50" y1="200" x2="350" y2="200" stroke="rgba(0,240,255,0.4)" stroke-width="2" stroke-dasharray="10 15"/>
  <line x1="20" y1="350" x2="420" y2="350" stroke="rgba(0,240,255,0.5)" stroke-width="3" stroke-dasharray="20 10"/>

  <path d="M 0 500 L 1000 500" stroke="rgba(255,255,255,0.2)" stroke-width="4"/>
  <path d="M 0 540 L 1000 540" stroke="rgba(0,240,255,0.5)" stroke-width="6"/>

  <!-- Frame 2: Explosion Phase -->
  <g transform="translate(320, 180)">
    <ellipse cx="120" cy="240" rx="160" ry="30" fill="url(#glowCyan2)" filter="blur(18px)"/>
    
    <!-- Athlete Pose 2 -->
    <path d="M 140 100 L 220 120 L 180 200 L 100 180 Z" fill="#00f0ff"/>
    <circle cx="250" cy="90" r="28" fill="#ffffff"/>
    <path d="M 210 120 L 310 150 L 290 230" stroke="#00f0ff" stroke-width="16" stroke-linecap="round" fill="none"/>
    <path d="M 150 140 L 90 220 L 30 260" stroke="#2563eb" stroke-width="16" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Telemetry HUD Overlay Frame 2 -->
  <text x="50" y="70" fill="#00f0ff" font-family="monospace" font-size="20" font-weight="bold">FRAME 02 // LAUNCH EXPLOSION • VELOCITY: 6.4 m/s</text>
</svg>
