<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040914"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="glowCyan5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="600" fill="url(#bgGrad5)"/>
  
  <!-- Victory Finish Line Ribbon -->
  <line x1="780" y1="0" x2="780" y2="600" stroke="#f59e0b" stroke-width="8" stroke-dasharray="15 10"/>

  <path d="M 0 500 L 1000 500" stroke="rgba(255,255,255,0.3)" stroke-width="4"/>
  <path d="M 0 540 L 1000 540" stroke="#f59e0b" stroke-width="6"/>

  <!-- Frame 5: Victory Finish Cross -->
  <g transform="translate(700, 100)">
    <ellipse cx="60" cy="310" rx="200" ry="40" fill="url(#glowCyan5)" filter="blur(25px)"/>
    
    <!-- Athlete Pose 5 -->
    <path d="M 80 60 L 170 65 L 120 150 L 50 130 Z" fill="#00f0ff"/>
    <circle cx="200" cy="40" r="28" fill="#ffffff"/>
    <path d="M 140 75 L 260 90 L 290 200" stroke="#f59e0b" stroke-width="18" stroke-linecap="round" fill="none"/>
    <path d="M 90 100 L 20 180 L -30 240" stroke="#00f0ff" stroke-width="18" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Telemetry HUD Overlay Frame 5 -->
  <text x="50" y="70" fill="#f59e0b" font-family="monospace" font-size="20" font-weight="bold">FRAME 05 // VICTORY FINISH LINE • CHAMPION RECORD</text>
</svg>
