<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="500" height="600">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="75%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <radialGradient id="trophyGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#eab308" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glassPedestal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="goldShine" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#000000" flood-opacity="0.7"/>
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#eab308" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <ellipse cx="250" cy="240" rx="220" ry="200" fill="url(#trophyGlow)"/>

  <g filter="url(#goldShine)">
    <!-- Base Pedestal -->
    <path d="M 160 480 L 340 480 L 370 540 L 130 540 Z" fill="url(#glassPedestal)" stroke="#eab308" stroke-width="2"/>
    <rect x="180" y="440" width="140" height="40" rx="6" fill="url(#goldGrad)"/>

    <!-- Stem & Nodes -->
    <path d="M 230 360 L 270 360 L 260 440 L 240 440 Z" fill="url(#goldGrad)"/>
    <ellipse cx="250" cy="360" rx="35" ry="12" fill="#fef08a"/>

    <!-- Trophy Cup -->
    <path d="M 140 100 Q 130 280 250 350 Q 370 280 360 100 Z" fill="url(#goldGrad)"/>
    
    <!-- Cup Rim & Interior Depth -->
    <ellipse cx="250" cy="100" rx="110" ry="28" fill="#ca8a04"/>
    <ellipse cx="250" cy="100" rx="95" ry="22" fill="#713f12"/>

    <!-- Handles -->
    <path d="M 140 140 C 60 160 60 260 170 280" fill="none" stroke="url(#goldGrad)" stroke-width="22" stroke-linecap="round"/>
    <path d="M 360 140 C 440 160 440 260 330 280" fill="none" stroke="url(#goldGrad)" stroke-width="22" stroke-linecap="round"/>

    <!-- Star Emblem -->
    <polygon points="250,170 258,195 285,195 263,211 271,236 250,220 229,236 237,211 215,195 242,195" fill="#ffffff" opacity="0.95"/>

    <!-- Specular Flare Lines -->
    <path d="M 170 120 Q 160 240 240 330" fill="none" stroke="#ffffff" stroke-width="8" opacity="0.4" stroke-linecap="round"/>
  </g>
</svg>
